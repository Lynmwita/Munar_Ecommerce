<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
      .badge-bg { fill: #4a2f24; }
      .brand-title {
        font-family: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
        font-size: 58px;
        font-weight: 600;
        letter-spacing: 0.14em;
        fill: #ebdccb;
      }
      .brand-tagline {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.22em;
        fill: #ebdccb;
        text-anchor: end;
      }
    </style>
  </defs>
  
  <!-- Background Circle in Signature Rich Mocha #4a2f24 -->
  <circle cx="200" cy="200" r="185" class="badge-bg" />
  <circle cx="200" cy="200" r="177" fill="none" stroke="#ebdccb" stroke-opacity="0.15" stroke-width="1" />
  
  <!-- Group positioned in optical center -->
  <g transform="translate(85, 208)">
    <!-- MUNAR Wordmark -->
    <text x="0" y="0" class="brand-title">MUNAR</text>
    <!-- QUIET, LUXE Tagline positioned under right edge (under NAR) -->
    <text x="226" y="22" class="brand-tagline">QUIET, LUXE</text>
  </g>
</svg>